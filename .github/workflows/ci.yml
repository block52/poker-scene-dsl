name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # poker-engine-ts for the adapter scenarios (skipped when absent).
      - run: npm ci
        working-directory: adapters/pokerenginets
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
